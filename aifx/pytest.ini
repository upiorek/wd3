[pytest]
# Pytest configuration for Support Breakout Strategy testing

# Register custom markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = -v --tb=short

# Coverage options (when using --cov)
# Example: pytest test_strategy.py --cov=support_breakout_strategy --cov-report=html
